name: ci-practice

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
env:
  GLOBAL_VAR: "This is a global variable"

jobs:
  run-test:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: "This is a job-specific variable"
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Use Variables
        env:
          STEP_VAR: "This is a step-specific variable"
        run: |
          echo "Matrix Node Version: ${{ matrix.node-version }}"
          echo "Global Variable: $GLOBAL_VAR"
          echo "Job Variable: $JOB_VAR"
          echo "step specific variable: $STEP_VAR"

      - name: GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"

      - name: Checkout repository
        uses: actions/checkout@v4
      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Run tests with JUnit output
        run: npm test -- --test-reporter=junit --test-reporter-destination=test-results.xml
      - name: Upload test results (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results.xml
          retention-days: 7

  # Example: Download artifacts in a downstream job (e.g., for reporting/deployment)
  aggregate-results:
    runs-on: ubuntu-latest
    needs: run-test
    if: always()
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-node-*
          path: all-test-results
      - name: List downloaded artifacts
        run: |
          echo "=== Test Results ==="
          ls -la all-test-results/
      - name: Show sample test result
        run: |
          head -20 all-test-results/test-results-node-*/test-results.xml || true

  deploy:
    runs-on: ubuntu-latest
    needs: [run-test, aggregate-results]
    steps:
      - name: deploy
        run: echo "deploying... (artifacts available from aggregate-results job)"

      - name: only run on main branch
        if: github.ref == 'refs/heads/main'
        run: echo "This step runs only on the main branch."

      - name: only run on pull request
        if: github.event_name == 'pull_request'
        run: echo "This step runs only on pull requests."
